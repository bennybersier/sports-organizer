# pnpm blocks package build scripts by default. These need their postinstall to
# produce working native binaries or generated code.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@tailwindcss/oxide": true
  "@parcel/watcher": true
  "@swc/core": true
  "@google/genai": true
  "protobufjs": true
